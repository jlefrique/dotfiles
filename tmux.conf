# Use vi mode in Copy mode
set-window-option -g mode-keys vi
bind-key Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe
# Send copies to the X clipboard and primary selection, in any terminal
set-option -s copy-command "xclip -selection clipboard -i -f | xclip -selection primary -i"
# Let programs inside tmux (and remote tmux over ssh) set the clipboard via OSC 52
set-option -s set-clipboard on
unbind-key p
bind-key p paste-buffer

# Remap C-b to C-a
unbind-key C-b
set-option -g prefix C-a
bind-key C-a  send-prefix

# Starting at tmux 1.9 the default-path option was removed, so use the -c option
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Set history limit
set-option -g history-limit 50000

# Session tree (prefix s): sorted by name, without the preview pane.
bind-key s choose-tree -Zs -N -O name

# Reload key
bind-key r source-file ~/.tmux.conf \; display-message "Configuration reloaded"

# Start numbering at 1
set-option -g base-index 1
set-option -g pane-base-index 1

# Allows for faster key repetition
set-option -s escape-time 0

# Invert colors of active window: green locally, cyan when started over ssh
if-shell '[ -n "$SSH_CONNECTION" ]' \
    "set-option -g window-status-current-style 'bg=black,fg=cyan'; set-option -g status-bg cyan" \
    "set-option -g window-status-current-style 'bg=black,fg=green'; set-option -g status-bg green"

# Room for long session names (e.g. from tdir) before tmux cuts them.
set-option -g status-left-length 40

set-option -g default-terminal 'tmux-256color'

# Pass 24-bit color and copies (OSC 52) through to the outer terminal
set-option -as terminal-features ',alacritty:RGB:clipboard,xterm*:RGB'

# Set window titles
set-option -g set-titles on
set-option -g set-titles-string "tmux: #I [#W]"

# Open a man page in a new window
bind-key m command-prompt -p "Open man page for:" "split-window -h 'exec man %%'"

# View processes
bind-key '~' split-window -h "exec htop"

# Log output
bind-key H pipe-pane 'cat >> "$HOME/tmux-#S.log"' \; \
    display-message 'Started logging'
bind-key h pipe-pane \; display-message 'Ended logging'

# Fast session switching
bind-key g run-shell 'interpolation={session_name}; tmux list-sessions -F "#$interpolation"' \; \
    command-prompt -p "Session:" "send-keys C-m; run-shell 'tmux switch -t %1 || tmux display-message \"Not found\"'"

# Restore tmux environment
# Plugins read their options when loaded, so set them before run-shell.
set-option -g @resurrect-save 'C-s'
set-option -g @resurrect-restore 'C-r'
set-option -g @resurrect-strategy-vim 'session'
run-shell ~/dotfiles/tmux/plugins/tmux-resurrect/resurrect.tmux

# Save sessions every 15 minutes and restore the last save when tmux starts.
set-option -g @continuum-restore 'on'
run-shell ~/dotfiles/tmux/plugins/tmux-continuum/continuum.tmux
