# Copy mouse selections to the clipboard, not only the primary selection.
[selection]
save_to_clipboard = true

[font]
normal = { family = "Terminess Nerd Font" }
size = 12
# Trims the extra line height of the Nerd Font metrics.
offset = { x = 0, y = -4 }

# Nightfox carbonfox palette.
# Yellows replaced with IBM Carbon yellow 30/20; upstream uses teal.
# Upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/carbonfox/alacritty.toml
[colors.primary]
background = "#161616"
foreground = "#f2f4f8"

[colors.selection]
text = "#f2f4f8"
background = "#525253"

[colors.normal]
black = "#282828"
red = "#ee5396"
green = "#25be6a"
yellow = "#f1c21b"
blue = "#78a9ff"
magenta = "#be95ff"
cyan = "#33b1ff"
white = "#dfdfe0"

[colors.bright]
black = "#484848"
red = "#f16da6"
green = "#46c880"
yellow = "#fddc69"
blue = "#8cb6ff"
magenta = "#c8a5ff"
cyan = "#52bdff"
white = "#e4e4e5"

# Shift+Insert pastes the clipboard (which receives Windows host copies)
# instead of the primary selection.
[keyboard]
bindings = [
    { key = "Insert", mods = "Shift", action = "Paste" },
]
